[package]
name = "aggregate-json"
authors = ["Thorsten Hans <thorsten.hans@gmail.com>"]
description = "Aggregate multiple upstream JSON APIs at the edge"
version = "0.1.0"
rust-version = "1.93"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spin-sdk = "7.0.0"

[workspace]
