spin_manifest_version = 2

[application]
name = "aggregate-json"
version = "0.1.0"
authors = ["Thorsten Hans <thorsten.hans@gmail.com>"]
description = "Aggregate multiple upstream JSON APIs at the edge"

[[trigger.http]]
route = "/..."
component = "aggregate-json"

[component.aggregate-json]
source = "target/wasm32-wasip2/release/aggregate_json.wasm"
allowed_outbound_hosts = ["https://random-data-api.fermyon.app"]
[component.aggregate-json.build]
command = "cargo build --target wasm32-wasip2 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
